<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Controls dev harness</title>
  </head>
  <body>
    <div id="app">
      <div id="map" aria-label="Map of California crops"></div>
      <div class="vignette" aria-hidden="true"></div>
      <header id="title-pill" class="glass pill">
        <h1>What&rsquo;s growing here? <span class="sprout" aria-hidden="true">🌱</span></h1>
      </header>
      <div id="search-slot"></div>
      <div id="month-slot"></div>
      <div id="popup-root"></div>
    </div>
    <script type="module">
      import './src/main.ts';
      import { initControls } from './src/ui/controls.ts';
      import { loadIconManifest } from './src/lib/icons.ts';
      import { REGIONS_URL } from './src/config.ts';

      const manifest = await loadIconManifest();
      const regionsSearch = (await (await fetch(REGIONS_URL)).json()).search;
      const app = await new Promise((resolve) => {
        const poll = () => (window.__app ? resolve(window.__app) : setTimeout(poll, 50));
        poll();
      });
      window.__controls = initControls({
        map: app.map,
        crops: app.crops,
        fields: app.fields,
        regionsSearch,
        manifest,
        markers: app.markers,
        searchSlot: document.getElementById('search-slot'),
        monthSlot: document.getElementById('month-slot'),
      });
    </script>
  </body>
</html>
