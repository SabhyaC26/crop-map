name: Deploy

# main deploys to production (crops.sabhyachhabria.com); any other branch gets a preview at <branch>.<project>.pages.dev.
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Forks have no PAGES_PROJECT variable or Cloudflare secrets, so they skip deploying.
    if: vars.PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASEMAP_URL: ${{ vars.TILES_BASE }}/basemap.pmtiles
          VITE_FIELDS_URL: ${{ vars.TILES_BASE }}/fields.pmtiles
          VITE_OVERVIEW_URL: ${{ vars.TILES_BASE }}/overview.pmtiles
          VITE_FIELDS_LOW_URL: ${{ vars.TILES_BASE }}/fields-low.pmtiles
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch "${{ github.ref_name }}" --commit-hash "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
