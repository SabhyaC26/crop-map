[project]
name = "ca-crop-map"
version = "0.1.0"
description = "Pipeline for the California crop map"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.2.0",
    "h3>=4",
    "openpyxl>=3.1.5",
    "pyogrio>=0.13.0",
    "pypdf>=6.19.0",
    "pyproj>=3.8.0",
    "pytest>=9.1.1",
    "shapely>=2.1.2",
]

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]
